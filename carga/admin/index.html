<!DOCTYPE html>
<html lang="es" class="sin-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Boren Studio — Cargas y confirmaciones</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/carga/assets/estilos.css">
</head>

<body class="flex min-h-dvh flex-col antialiased">

<noscript>
  <div class="mx-auto max-w-md px-5 py-20 text-center">
    <h1 class="text-xl font-bold">Necesitas activar JavaScript</h1>
    <p class="mt-2 text-sm text-suave">El panel no puede funcionar sin él.</p>
  </div>
</noscript>

<!-- ══════════ Candado ══════════ -->
<section id="candado" hidden class="grid flex-1 place-items-center px-5 py-12">
  <div class="w-full max-w-[21rem] text-center">
    <div class="revelar marca mx-auto mb-6 size-11 text-xl">B</div>
    <h1 class="revelar text-[1.6rem] leading-tight font-bold tracking-[-0.02em]">Panel Boren Studio</h1>
    <p class="revelar mt-2 text-[0.9rem] text-suave">Escribe tu PIN para entrar</p>

    <form id="form-pin" class="revelar mt-8" autocomplete="off">
      <div class="flex justify-center gap-2" id="casillas">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 1">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 2">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 3">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 4">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 5">
        <input class="digito size-12" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 6">
      </div>

      <p id="pin-error" class="mt-4 min-h-[2.75rem] text-[0.85rem] leading-snug text-alerta" role="alert"></p>

      <button type="submit" class="btn w-full px-6 py-3.5" id="btn-entrar" disabled>
        <span id="btn-entrar-texto">Entrar</span>
      </button>
    </form>
  </div>
</section>

<!-- ══════════ Panel ══════════ -->
<div id="panel" hidden class="flex flex-1 flex-col">
  <header class="border-b border-linea">
    <div class="mx-auto flex w-full max-w-[70rem] items-center justify-between gap-4 px-5 py-4 sm:px-8">
      <div class="flex items-center gap-3">
        <div class="marca size-9 text-lg">B</div>
        <div class="leading-tight">
          <div class="text-[0.95rem] font-semibold tracking-tight">Panel Boren Studio</div>
          <div class="text-xs text-suave">Material de clientes</div>
        </div>
      </div>
      <div class="flex items-center gap-1 sm:gap-2">
        <button id="btn-confirmaciones" type="button"
                class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-2 text-[0.78rem] font-medium text-suave transition-colors hover:bg-violeta-tenue hover:text-violeta sm:px-3 sm:text-[0.85rem]">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M17 11l2 2 4-5"/></svg>
          <span class="max-w-[7.5rem] text-left leading-tight sm:max-w-none">Confirmaciones de invitados</span>
        </button>
        <button id="btn-salir" type="button"
                class="rounded-lg px-2.5 py-2 text-[0.78rem] font-medium text-suave transition-colors hover:bg-nieve hover:text-texto sm:px-3 sm:text-[0.85rem]">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main id="vista" class="mx-auto w-full max-w-[70rem] flex-1 px-5 py-9 sm:px-8"></main>

  <footer class="border-t border-linea">
    <div class="mx-auto flex w-full max-w-[70rem] items-center justify-center gap-2.5 px-5 py-5 text-[0.82rem] text-tenue">
      <span>Boren Studio · Panel administrativo</span>
      <span class="marca size-5 text-[0.62rem]">B</span>
    </div>
  </footer>
</div>

<script type="module">
import { animate } from "/carga/assets/motion.js";

const raiz = document.documentElement;
raiz.classList.remove("sin-js");
setTimeout(() => raiz.classList.add("animado"), 1600);

const API = "/carga/admin/api";
const $ = (id) => document.getElementById(id);
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;

const revelar = (els, base = 0.03) => {
  if (reducido) { raiz.classList.add("animado"); return; }
  [...els].forEach((el, i) =>
    animate(el, { opacity: [0, 1], transform: ["translateY(8px)", "translateY(0px)"] },
      { duration: 0.4, delay: base + i * 0.04, easing: [0.22, 1, 0.36, 1] }));
};

const peso = (b) => {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), 4);
  return `${(b / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
};
const escapar = (t) => String(t).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Para la cuota usamos dos decimales: con uno solo, el tope de 9.99 GB se
   redondea a "10.0 GB" y parece un límite distinto del que está configurado. */
const pesoGB = (b) => `${(b / 1024 ** 3).toFixed(2)} GB`;
const fechaConfirmacion = (valor) => new Intl.DateTimeFormat("es-MX", {
  dateStyle: "medium",
  timeStyle: "short",
  timeZone: "America/Mexico_City",
}).format(new Date(valor));

/* ══════════ Candado ══════════ */
const casillas = [...$("casillas").querySelectorAll("input")];
const pinActual = () => casillas.map((c) => c.value).join("");

function refrescar() {
  casillas.forEach((c) => { c.dataset.lleno = c.value ? "si" : "no"; });
  $("btn-entrar").disabled = pinActual().length !== 6;
}

casillas.forEach((casilla, i) => {
  casilla.addEventListener("input", () => {
    casilla.value = casilla.value.replace(/\D/g, "").slice(0, 1);
    refrescar();
    if (casilla.value && i < 5) casillas[i + 1].focus();
    if (pinActual().length === 6) $("form-pin").requestSubmit();
  });
  casilla.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !casilla.value && i > 0) {
      casillas[i - 1].focus();
      casillas[i - 1].value = "";
      refrescar();
    }
    if (e.key === "ArrowLeft" && i > 0) casillas[i - 1].focus();
    if (e.key === "ArrowRight" && i < 5) casillas[i + 1].focus();
  });
  casilla.addEventListener("paste", (e) => {
    e.preventDefault();
    const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    d.split("").forEach((x, k) => { if (casillas[k]) casillas[k].value = x; });
    refrescar();
    casillas[Math.min(d.length, 5)].focus();
    if (d.length === 6) $("form-pin").requestSubmit();
  });
});

function limpiarPin(enfocar = true) {
  casillas.forEach((c) => (c.value = ""));
  refrescar();
  if (enfocar) casillas[0].focus();
}

function sacudir() {
  if (reducido) return;
  animate($("casillas"),
    { transform: ["translateX(0px)", "translateX(-7px)", "translateX(7px)", "translateX(-4px)", "translateX(0px)"] },
    { duration: 0.38 });
}

let enviando = false;

$("form-pin").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (enviando || pinActual().length !== 6) return;

  enviando = true;
  $("btn-entrar").disabled = true;
  $("btn-entrar-texto").textContent = "Comprobando…";
  $("pin-error").textContent = "";

  try {
    const r = await fetch(`${API}/entrar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pinActual() }),
    });
    const d = await r.json().catch(() => ({}));

    if (r.ok && d.ok) { abrirPanel(); return; }

    $("pin-error").textContent = d.error || "No se pudo entrar.";
    sacudir();
    limpiarPin();

    if (r.status === 429) {
      casillas.forEach((c) => (c.disabled = true));
      $("btn-entrar").disabled = true;
      $("btn-entrar-texto").textContent = "Bloqueado";
      return;
    }
  } catch {
    $("pin-error").textContent = "Sin conexión. Revisa tu señal.";
  } finally {
    if (!casillas[0].disabled) $("btn-entrar-texto").textContent = "Entrar";
    enviando = false;
    refrescar();
  }
});

function mostrarCandado(bloqueadoMs = 0) {
  $("panel").hidden = true;
  $("candado").hidden = false;
  revelar($("candado").querySelectorAll(".revelar"));

  if (bloqueadoMs > 0) {
    const min = Math.ceil(bloqueadoMs / 60000);
    $("pin-error").textContent =
      `Demasiados intentos. Vuelve a intentar en ${min >= 60 ? `${Math.ceil(min / 60)} h` : `${min} min`}.`;
    casillas.forEach((c) => (c.disabled = true));
    $("btn-entrar-texto").textContent = "Bloqueado";
  } else {
    setTimeout(() => casillas[0].focus(), 300);
  }
}

function abrirPanel() {
  $("candado").hidden = true;
  $("panel").hidden = false;
  limpiarPin(false);
  casillas.forEach((c) => (c.disabled = false));
  $("btn-entrar-texto").textContent = "Entrar";
  const inicial = decodeURIComponent(location.hash.slice(1));
  inicial === "confirmaciones" ? verConfirmaciones() : inicial ? verCarpeta(inicial) : verCarpetas();
}

$("btn-salir").addEventListener("click", async () => {
  await fetch(`${API}/salir`, { method: "POST" }).catch(() => {});
  location.hash = "";
  mostrarCandado();
});

$("btn-confirmaciones").addEventListener("click", verConfirmaciones);

/* ══════════ Datos ══════════ */
const SVG_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" class="size-8"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h7A2.5 2.5 0 0 1 15 7.5v9A2.5 2.5 0 0 1 12.5 19h-7A2.5 2.5 0 0 1 3 16.5z"/><path d="M15 10.5l5-3v9l-5-3z"/></svg>';
const SVG_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" class="size-8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const SVG_BAJAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>';
const SVG_ATRAS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-4"><path d="M15 5l-7 7 7 7"/></svg>';
const SVG_FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="size-5 text-tenue"><path d="M9 5l7 7-7 7"/></svg>';

const vista = () => $("vista");

let propio = false;
function fijarHash(v) {
  if (location.hash.slice(1) === v) return;
  propio = true;
  location.hash = v;
}

async function pedir(ruta) {
  const r = await fetch(API + ruta, { headers: { Accept: "application/json" }, cache: "no-store" });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { mostrarCandado(); throw new Error("sesion"); }
  if (!r.ok || !d.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

function cargando(texto) {
  vista().innerHTML =
    `<div class="py-24 text-center">
       <div class="mx-auto mb-4 size-6 animate-spin rounded-full border-2 border-linea border-t-violeta"></div>
       <span class="text-[0.88rem] text-suave">${texto}</span>
     </div>`;
}

function fallo(m) {
  if (m === "sesion") return;
  vista().innerHTML = `<div class="py-24 text-center text-[0.9rem] text-alerta">${escapar(m)}</div>`;
}

/* ── Tarjetas de consumo ── */
function tarjetasCuota(c) {
  const pct = c.tope > 0 ? Math.min(100, (c.usado / c.tope) * 100) : 0;
  const nivel = c.disponible <= 0 ? "lleno" : pct >= 80 ? "alto" : "normal";
  const renueva = new Date(c.seLiberaEl).toLocaleDateString("es-MX",
    { day: "numeric", month: "long", timeZone: "America/Mexico_City" });

  return `
  <div class="revelar grid grid-cols-1 gap-3 sm:grid-cols-3">
    <div class="carta p-4 sm:col-span-2">
      <div class="flex items-baseline justify-between gap-3">
        <span class="text-[0.85rem] font-semibold">Almacenamiento del periodo</span>
        <span class="text-[0.85rem] text-suave tabular">${pesoGB(c.usado)} de ${pesoGB(c.tope)}</span>
      </div>
      <div class="medidor mt-3" data-nivel="${nivel}"><i style="width:${pct}%"></i></div>
      <div class="mt-2.5 flex items-baseline justify-between gap-3 text-[0.78rem] text-suave tabular">
        <span>${pct.toFixed(1)}% utilizado</span>
        <span>${c.disponible > 0 ? `${pesoGB(c.disponible)} disponibles` : "Sin espacio"}</span>
      </div>
    </div>

    <div class="carta carta-tinta flex flex-col justify-center p-4">
      <div class="text-[0.85rem] font-semibold text-violeta">Se renueva en</div>
      <div class="mt-1 text-[2rem] leading-none font-bold tracking-tight tabular">
        ${c.dias} <span class="text-base font-medium text-suave">${c.dias === 1 ? "día" : "días"}</span>
      </div>
      <div class="mt-1.5 text-[0.78rem] text-suave">El ${renueva}</div>
    </div>
  </div>`;
}

/* ── Lista de entregas ── */
async function verCarpetas() {
  cargando("Cargando entregas…");
  fijarHash("");

  try {
    const d = await pedir("/carpetas");
    const v = vista();
    const n = d.carpetas.length;

    v.innerHTML = `
      <div class="revelar">
        <h2 class="text-[clamp(1.5rem,4.5vw,2rem)] leading-tight font-bold tracking-[-0.022em]">
          ${n ? `${n} ${n === 1 ? "entrega" : "entregas"}` : "Sin entregas todavía"}
        </h2>
        <p class="mt-2 text-[0.9rem] text-suave">
          ${n ? "Más recientes primero. Todo se borra solo a los 10 días."
              : "Cuando un cliente suba archivos en borenstudio.com/carga, aparecerán aquí."}
        </p>
      </div>
      ${d.cuota ? `<div class="mt-7">${tarjetasCuota(d.cuota)}</div>` : ""}
      ${d.truncado ? `<p class="mt-4 text-xs text-tenue">Hay más objetos de los que caben en una lista; se muestran los primeros 10 000.</p>` : ""}
      <div class="mt-8 flex flex-col gap-2.5" id="entregas"></div>`;

    const cont = $("entregas");
    for (const c of d.carpetas) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "revelar carta grid w-full grid-cols-[1fr_auto] items-center gap-4 p-4 text-left transition-colors hover:border-violeta-linea hover:bg-violeta-tenue";
      b.innerHTML = `
        <div class="min-w-0">
          <div class="truncate text-[1rem] font-semibold tracking-tight">${escapar(c.negocio)}</div>
          <div class="mt-1 text-[0.8rem] text-suave tabular">
            ${c.fecha} &nbsp;·&nbsp; ${c.cantidad} ${c.cantidad === 1 ? "archivo" : "archivos"} &nbsp;·&nbsp; ${peso(c.bytes)}
          </div>
        </div>${SVG_FLECHA}`;
      b.addEventListener("click", () => verCarpeta(c.prefijo));
      cont.appendChild(b);
    }

    revelar(v.querySelectorAll(".revelar"));
  } catch (e) { fallo(e.message); }
}

/* ── Confirmaciones de invitados ── */
async function verConfirmaciones() {
  cargando("Cargando confirmaciones…");
  fijarHash("confirmaciones");

  try {
    const d = await pedir("/confirmaciones");
    const v = vista();
    const filas = d.confirmaciones.map((c, i) => `
      <li class="revelar flex items-start gap-4 border-t border-linea py-4 first:border-t-0">
        <span class="grid size-9 shrink-0 place-items-center rounded-full bg-violeta-tenue text-[0.78rem] font-semibold text-violeta tabular">${i + 1}</span>
        <div class="min-w-0 flex-1">
          <div class="break-words text-[0.98rem] font-semibold tracking-tight">${escapar(c.nombre)}</div>
          <div class="mt-1 text-[0.76rem] text-suave tabular">Confirmó el ${fechaConfirmacion(c.confirmadoEn)}</div>
        </div>
        <span class="shrink-0 rounded-full bg-violeta-tenue px-2.5 py-1 text-[0.7rem] font-semibold text-violeta">Confirmado</span>
      </li>`).join("");

    v.innerHTML = `
      <button type="button" id="btn-volver-cargas"
              class="revelar mb-6 inline-flex items-center gap-2 rounded-lg px-2 py-1.5 -ml-2 text-[0.85rem] font-medium text-suave transition-colors hover:bg-nieve hover:text-texto">
        ${SVG_ATRAS}<span>Volver a cargas de clientes</span>
      </button>

      <div class="revelar flex items-end justify-between gap-5">
        <div>
          <div class="text-[0.76rem] font-semibold tracking-[0.12em] text-violeta uppercase">Invitación Luca Santiago</div>
          <h2 class="mt-2 text-[clamp(1.55rem,5vw,2.2rem)] leading-tight font-bold tracking-[-0.025em]">Confirmaciones de invitados</h2>
          <p class="mt-2 text-[0.88rem] text-suave">Esta lista está separada de los archivos que envían tus clientes.</p>
        </div>
        <div class="shrink-0 text-right">
          <div class="text-[2.8rem] leading-none font-bold tracking-tight tabular">${d.total}</div>
          <div class="mt-1 text-[0.72rem] text-suave">${d.total === 1 ? "persona" : "personas"}</div>
        </div>
      </div>

      <section class="revelar carta mt-8 overflow-hidden px-5 sm:px-6">
        ${d.total ? `<ol>${filas}</ol>`
            : `<div class="py-16 text-center"><p class="text-[0.95rem] font-medium">Todavía no hay confirmaciones.</p><p class="mt-2 text-[0.82rem] text-suave">Cuando un invitado confirme, su nombre aparecerá aquí.</p></div>`}
      </section>`;

    $("btn-volver-cargas").addEventListener("click", verCarpetas);
    revelar(v.querySelectorAll(".revelar"));
    scrollTo(0, 0);
  } catch (e) { fallo(e.message); }
}

/* ── Detalle de una entrega ── */
async function verCarpeta(prefijo) {
  cargando("Abriendo entrega…");
  fijarHash(encodeURIComponent(prefijo));

  try {
    const d = await pedir(`/carpeta?p=${encodeURIComponent(prefijo)}`);
    const v = vista();

    v.innerHTML = `
      <button type="button" id="btn-atras"
              class="revelar mb-6 inline-flex items-center gap-2 rounded-lg px-2 py-1.5 -ml-2 text-[0.85rem] font-medium text-suave transition-colors hover:bg-nieve hover:text-texto">
        ${SVG_ATRAS}<span>Todas las entregas</span>
      </button>

      <div class="revelar flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="min-w-0">
          <h2 class="text-[clamp(1.4rem,4.5vw,1.9rem)] leading-tight font-bold tracking-[-0.022em]">${escapar(d.negocio)}</h2>
          <p class="mt-2 text-[0.85rem] text-suave tabular">
            ${d.fecha} &nbsp;·&nbsp; ${d.cantidad} ${d.cantidad === 1 ? "archivo" : "archivos"} &nbsp;·&nbsp; ${peso(d.bytes)}
          </p>
        </div>
        <a class="btn shrink-0 px-5 py-3" href="${API}/zip?p=${encodeURIComponent(prefijo)}">
          ${SVG_BAJAR}<span>Descargar todo</span>
        </a>
      </div>

      <div class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4" id="rejilla"></div>`;

    $("btn-atras").addEventListener("click", verCarpetas);

    const rejilla = $("rejilla");
    d.archivos.forEach((a) => {
      const p = document.createElement("div");
      p.className = "revelar carta flex flex-col overflow-hidden";

      const lienzo = document.createElement("div");
      lienzo.className = "grid aspect-square place-items-center bg-nieve text-tenue";
      if (a.vista) {
        const img = document.createElement("img");
        img.src = a.vista;
        img.alt = a.nombre;
        img.loading = "lazy";
        img.decoding = "async";
        img.className = "size-full object-cover";
        // Si el navegador no sabe leer el formato (HEIC en Chrome), cae al ícono.
        img.onerror = () => { lienzo.innerHTML = SVG_DOC; };
        lienzo.appendChild(img);
      } else {
        lienzo.innerHTML = a.tipo === "video" ? SVG_VIDEO : SVG_DOC;
      }

      const info = document.createElement("div");
      info.className = "flex flex-1 flex-col gap-2 border-t border-linea p-3";
      info.innerHTML = `
        <div class="line-clamp-2 text-[0.78rem] leading-snug font-medium break-words">${escapar(a.nombre)}</div>
        <div class="mt-auto text-[0.72rem] text-suave tabular">${peso(a.bytes)}</div>
        <a class="btn btn-borde w-full px-2 py-2 text-[0.75rem]" href="${a.descarga}">
          ${SVG_BAJAR}<span>Descargar</span>
        </a>`;

      p.append(lienzo, info);
      rejilla.appendChild(p);
    });

    revelar(v.querySelectorAll(".revelar"));
    scrollTo(0, 0);
  } catch (e) { fallo(e.message); }
}

/* ══════════ Arranque ══════════ */
addEventListener("hashchange", () => {
  if (propio) { propio = false; return; }
  if (!$("candado").hidden) return;
  const p = decodeURIComponent(location.hash.slice(1));
  p === "confirmaciones" ? verConfirmaciones() : p ? verCarpeta(p) : verCarpetas();
});

try {
  const r = await fetch(`${API}/sesion`, { cache: "no-store" });
  const d = await r.json();
  if (d.sesion) {
    $("panel").hidden = false;
    const inicial = decodeURIComponent(location.hash.slice(1));
    inicial === "confirmaciones" ? verConfirmaciones() : inicial ? verCarpeta(inicial) : verCarpetas();
  } else {
    mostrarCandado(d.bloqueadoMs || 0);
  }
} catch {
  mostrarCandado();
}
</script>
</body>
</html>
