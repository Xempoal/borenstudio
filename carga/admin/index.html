<!DOCTYPE html>
<html lang="es" class="sin-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivo — Boren Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=swap">
<link rel="stylesheet" href="/carga/assets/estilos.css">
</head>

<body class="min-h-dvh antialiased">

<noscript>
  <div class="mx-auto max-w-md px-5 py-20 text-center">
    <h1 class="font-display text-2xl">Necesitas activar JavaScript</h1>
    <p class="mt-3 text-sm text-tinta-media">El panel no puede funcionar sin él.</p>
  </div>
</noscript>

<!-- ══════════ Candado ══════════ -->
<section id="candado" class="grid min-h-dvh place-items-center px-5 py-12" hidden>
  <div class="w-full max-w-[20rem] text-center">
    <div class="revelar mx-auto mb-7 grid size-11 place-items-center rounded-sm bg-tinta pb-0.5 font-display text-2xl leading-none text-papel">B</div>

    <h1 class="revelar font-display text-3xl leading-none tracking-tight">Archivo</h1>
    <p class="revelar etiqueta mt-3 normal-case tracking-[0.05em]">Escribe el PIN para entrar</p>

    <form id="form-pin" class="revelar mt-9" autocomplete="off">
      <div class="flex justify-center gap-2" id="casillas">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 1">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 2">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 3">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 4">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 5">
        <input class="digito size-11 rounded-none" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 6">
      </div>

      <p id="pin-error" class="mt-5 min-h-[2.5rem] text-[0.8rem] leading-snug text-velado" role="alert"></p>

      <button type="submit" class="boton w-full px-6 py-4" id="btn-entrar" disabled>
        <span id="btn-entrar-texto">Entrar</span>
      </button>
    </form>
  </div>
</section>

<!-- ══════════ Panel ══════════ -->
<div id="panel" hidden class="mx-auto w-full max-w-4xl px-5 pb-[calc(4rem+env(safe-area-inset-bottom))]">

  <header class="filete-no flex items-center justify-between gap-4 border-b border-[color-mix(in_oklab,var(--color-tinta)_12%,transparent)] py-6">
    <div class="flex items-center gap-3">
      <div class="grid size-8 shrink-0 place-items-center rounded-sm bg-tinta pb-0.5 font-display text-xl leading-none text-papel">B</div>
      <div class="leading-none">
        <div class="font-display text-lg tracking-tight">Archivo</div>
        <span class="etiqueta mt-1 block">Material de clientes</span>
      </div>
    </div>
    <button id="btn-salir" class="etiqueta transition-colors hover:text-cobre" type="button">Salir</button>
  </header>

  <main id="vista" class="pt-9"></main>
</div>

<script type="module">
import { animate } from "/carga/assets/motion.js";

const raiz = document.documentElement;
raiz.classList.remove("sin-js");

const API = "/carga/admin/api";
const $ = (id) => document.getElementById(id);
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;

const revelar = (els, base = 0.04) => {
  if (reducido) { raiz.classList.add("animado"); return; }
  [...els].forEach((el, i) =>
    animate(el, { opacity: [0, 1], transform: ["translateY(10px)", "translateY(0px)"] },
      { duration: 0.45, delay: base + i * 0.05, easing: [0.22, 1, 0.36, 1] }));
};

// Red de seguridad: si una animación falla a medias, nada puede quedarse
// invisible. La clase `animado` fuerza opacidad 1 sobre todo lo revelable.
setTimeout(() => raiz.classList.add("animado"), 1600);

const peso = (b) => {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(Math.floor(Math.log(b) / Math.log(1024)), 4);
  return `${(b / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
};

/* ══════════ Candado ══════════ */
const casillas = [...$("casillas").querySelectorAll("input")];

const pinActual = () => casillas.map((c) => c.value).join("");

function refrescarCasillas() {
  casillas.forEach((c) => { c.dataset.lleno = c.value ? "si" : "no"; });
  $("btn-entrar").disabled = pinActual().length !== 6;
}

casillas.forEach((casilla, i) => {
  casilla.addEventListener("input", () => {
    casilla.value = casilla.value.replace(/\D/g, "").slice(0, 1);
    refrescarCasillas();
    if (casilla.value && i < casillas.length - 1) casillas[i + 1].focus();
    if (pinActual().length === 6) $("form-pin").requestSubmit();
  });
  casilla.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !casilla.value && i > 0) {
      casillas[i - 1].focus();
      casillas[i - 1].value = "";
      refrescarCasillas();
    }
    if (e.key === "ArrowLeft" && i > 0) casillas[i - 1].focus();
    if (e.key === "ArrowRight" && i < casillas.length - 1) casillas[i + 1].focus();
  });
  // Pegar el PIN completo desde el portapapeles.
  casilla.addEventListener("paste", (e) => {
    e.preventDefault();
    const digitos = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    digitos.split("").forEach((d, k) => { if (casillas[k]) casillas[k].value = d; });
    refrescarCasillas();
    casillas[Math.min(digitos.length, 5)].focus();
    if (digitos.length === 6) $("form-pin").requestSubmit();
  });
});

function limpiarPin(enfocar = true) {
  casillas.forEach((c) => (c.value = ""));
  refrescarCasillas();
  if (enfocar) casillas[0].focus();
}

function sacudir() {
  if (reducido) return;
  animate($("casillas"),
    { transform: ["translateX(0px)", "translateX(-7px)", "translateX(7px)", "translateX(-4px)", "translateX(0px)"] },
    { duration: 0.4 });
}

let enviandoPin = false;

$("form-pin").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (enviandoPin || pinActual().length !== 6) return;

  enviandoPin = true;
  $("btn-entrar").disabled = true;
  $("btn-entrar-texto").textContent = "Comprobando…";
  $("pin-error").textContent = "";

  try {
    const r = await fetch(`${API}/entrar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: pinActual() }),
    });
    const d = await r.json().catch(() => ({}));

    if (r.ok && d.ok) { abrirPanel(); return; }

    $("pin-error").textContent = d.error || "No se pudo entrar.";
    sacudir();
    limpiarPin();

    if (r.status === 429) {
      casillas.forEach((c) => (c.disabled = true));
      $("btn-entrar").disabled = true;
      $("btn-entrar-texto").textContent = "Bloqueado";
      return;
    }
  } catch {
    $("pin-error").textContent = "Sin conexión. Revisa tu señal.";
  } finally {
    if (!$("candado").hidden && !casillas[0].disabled) {
      $("btn-entrar-texto").textContent = "Entrar";
    }
    enviandoPin = false;
    refrescarCasillas();
  }
});

function mostrarCandado(bloqueadoMs = 0) {
  $("panel").hidden = true;
  $("candado").hidden = false;
  revelar($("candado").querySelectorAll(".revelar"));

  if (bloqueadoMs > 0) {
    const min = Math.ceil(bloqueadoMs / 60000);
    $("pin-error").textContent =
      `Demasiados intentos. Vuelve a intentar en ${min >= 60 ? `${Math.ceil(min / 60)} h` : `${min} min`}.`;
    casillas.forEach((c) => (c.disabled = true));
    $("btn-entrar-texto").textContent = "Bloqueado";
  } else {
    setTimeout(() => casillas[0].focus(), 350);
  }
}

function abrirPanel() {
  $("candado").hidden = true;
  $("panel").hidden = false;
  limpiarPin(false);
  casillas.forEach((c) => (c.disabled = false));
  $("btn-entrar-texto").textContent = "Entrar";
  verCarpetas();
}

$("btn-salir").addEventListener("click", async () => {
  await fetch(`${API}/salir`, { method: "POST" }).catch(() => {});
  location.hash = "";
  mostrarCandado();
});

/* ══════════ Datos ══════════ */
const SVG_VIDEO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="size-7"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h7A2.5 2.5 0 0 1 15 7.5v9A2.5 2.5 0 0 1 12.5 19h-7A2.5 2.5 0 0 1 3 16.5z"/><path d="M15 10.5l5-3v9l-5-3z"/></svg>';
const SVG_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" class="size-7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const SVG_BAJAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="size-3.5"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>';
const SVG_ATRAS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="size-3"><path d="M15 5l-7 7 7 7"/></svg>';
const SVG_FLECHA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-tinta-tenue"><path d="M9 5l7 7-7 7"/></svg>';

const vista = () => $("vista");

let propio = false;
function fijarHash(valor) {
  if (location.hash.slice(1) === valor) return;
  propio = true;
  location.hash = valor;
}

async function pedir(ruta) {
  const r = await fetch(API + ruta, { headers: { Accept: "application/json" }, cache: "no-store" });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { mostrarCandado(); throw new Error("sesion"); }
  if (!r.ok || !d.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

function cargando(texto) {
  vista().innerHTML =
    `<div class="py-20 text-center"><div class="mx-auto mb-4 size-5 animate-spin rounded-full border-2 border-[color-mix(in_oklab,var(--color-tinta)_14%,transparent)] border-t-cobre"></div>
     <span class="etiqueta normal-case tracking-[0.05em]">${texto}</span></div>`;
}

function fallo(mensaje) {
  if (mensaje === "sesion") return;
  vista().innerHTML = `<div class="py-20 text-center text-sm text-velado">${mensaje}</div>`;
}

/* ── Lista de carpetas ── */
async function verCarpetas() {
  cargando("Abriendo el archivo…");
  fijarHash("");

  try {
    const d = await pedir("/carpetas");
    const v = vista();
    v.textContent = "";

    const enc = document.createElement("div");
    enc.className = "revelar";
    enc.innerHTML = `
      <h2 class="font-display text-[clamp(1.8rem,6vw,2.6rem)] leading-none tracking-[-0.015em]">
        ${d.carpetas.length ? `${d.carpetas.length} ${d.carpetas.length === 1 ? "entrega" : "entregas"}` : "Sin entregas"}
      </h2>
      <p class="mt-3 text-sm text-tinta-media">
        ${d.carpetas.length
          ? "Más recientes primero. Todo se borra solo a los 10 días."
          : "Cuando un cliente suba material en borenstudio.com/carga, aparecerá aquí."}
      </p>`;
    v.appendChild(enc);

    // Medidor del periodo
    if (d.cuota) {
      const pct = d.cuota.tope > 0 ? Math.min(100, (d.cuota.usado / d.cuota.tope) * 100) : 0;
      const lleno = d.cuota.disponible <= 0;
      const cu = document.createElement("div");
      cu.className = "revelar mt-8 border-t border-[color-mix(in_oklab,var(--color-tinta)_12%,transparent)] pt-4";
      cu.innerHTML = `
        <div class="flex items-baseline justify-between gap-3">
          <span class="etiqueta">Espacio del periodo</span>
          <span class="font-mono text-[0.7rem] text-tinta-media">${peso(d.cuota.usado)} de ${peso(d.cuota.tope)}</span>
        </div>
        <div class="medidor mt-2" data-lleno="${lleno ? "si" : "no"}"><i style="width:${pct}%"></i></div>
        <p class="etiqueta mt-2 normal-case tracking-[0.04em]">Se reinicia el ${new Date(d.cuota.seLiberaEl).toLocaleDateString("es-MX", { day: "numeric", month: "long" })}</p>`;
      v.appendChild(cu);
    }

    if (d.truncado) {
      const t = document.createElement("p");
      t.className = "mt-4 text-xs text-tinta-tenue";
      t.textContent = "Hay más objetos de los que caben en una lista; se muestran los primeros 10 000.";
      v.appendChild(t);
    }

    const cont = document.createElement("div");
    cont.className = "mt-8 flex flex-col gap-2";

    d.carpetas.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "placa revelar grid w-full grid-cols-[1fr_auto] items-center gap-4 px-4 py-4 text-left hover:border-cobre";
      b.innerHTML = `
        <div class="min-w-0">
          <div class="truncate font-display text-lg leading-tight">${c.negocio}</div>
          <div class="mt-1.5 font-mono text-[0.68rem] text-tinta-tenue">
            ${c.fecha} &nbsp;·&nbsp; ${c.cantidad} ${c.cantidad === 1 ? "archivo" : "archivos"} &nbsp;·&nbsp; ${peso(c.bytes)}
          </div>
        </div>${SVG_FLECHA}`;
      b.addEventListener("click", () => verCarpeta(c.prefijo));
      cont.appendChild(b);
    });

    v.appendChild(cont);
    revelar(v.querySelectorAll(".revelar"));
  } catch (e) { fallo(e.message); }
}

/* ── Detalle de carpeta ── */
async function verCarpeta(prefijo) {
  cargando("Abriendo entrega…");
  fijarHash(encodeURIComponent(prefijo));

  try {
    const d = await pedir(`/carpeta?p=${encodeURIComponent(prefijo)}`);
    const v = vista();
    v.textContent = "";

    const atras = document.createElement("button");
    atras.type = "button";
    atras.className = "revelar etiqueta mb-6 inline-flex items-center gap-2 transition-colors hover:text-cobre";
    atras.innerHTML = `${SVG_ATRAS}<span>Todas las entregas</span>`;
    atras.addEventListener("click", verCarpetas);
    v.appendChild(atras);

    const enc = document.createElement("div");
    enc.className = "revelar";
    enc.innerHTML = `
      <h2 class="font-display text-[clamp(1.7rem,5.5vw,2.4rem)] leading-none tracking-[-0.015em]">${d.negocio}</h2>
      <p class="mt-3 font-mono text-xs text-tinta-media">
        ${d.fecha} &nbsp;·&nbsp; ${d.cantidad} ${d.cantidad === 1 ? "archivo" : "archivos"} &nbsp;·&nbsp; ${peso(d.bytes)}
      </p>`;
    v.appendChild(enc);

    const acc = document.createElement("div");
    acc.className = "revelar mt-6";
    acc.innerHTML = `<a class="boton flex w-full items-center justify-center gap-2.5 px-6 py-4"
        href="${API}/zip?p=${encodeURIComponent(prefijo)}">${SVG_BAJAR}<span>Descargar toda la entrega</span></a>`;
    v.appendChild(acc);

    const rejilla = document.createElement("div");
    rejilla.className = "mt-8 grid grid-cols-2 gap-2.5 sm:grid-cols-3 lg:grid-cols-4";

    d.archivos.forEach((a, i) => {
      const p = document.createElement("div");
      p.className = "placa revelar flex flex-col overflow-hidden";

      const lienzo = document.createElement("div");
      lienzo.className = "relative grid aspect-square place-items-center bg-papel-hondo text-tinta-tenue";
      if (a.vista) {
        const img = document.createElement("img");
        img.src = a.vista;
        img.alt = a.nombre;
        img.loading = "lazy";
        img.decoding = "async";
        img.className = "size-full object-cover";
        // Si el navegador no sabe leer el formato (HEIC en Chrome), caemos al ícono.
        img.onerror = () => { lienzo.innerHTML = SVG_DOC; };
        lienzo.appendChild(img);
      } else {
        lienzo.innerHTML = a.tipo === "video" ? SVG_VIDEO : SVG_DOC;
      }

      const num = document.createElement("span");
      num.className = "absolute left-2 top-2 bg-papel/85 px-1.5 py-0.5 font-mono text-[0.6rem] text-tinta-media";
      num.textContent = String(i + 1).padStart(2, "0");
      lienzo.appendChild(num);

      const info = document.createElement("div");
      info.className = "flex flex-1 flex-col gap-2 p-2.5";
      info.innerHTML = `
        <div class="line-clamp-2 text-[0.72rem] leading-snug break-words">${a.nombre}</div>
        <div class="mt-auto font-mono text-[0.62rem] text-tinta-tenue">${peso(a.bytes)}</div>
        <a class="boton boton-tenue flex items-center justify-center gap-1.5 px-2 py-2 text-[0.6rem]"
           href="${a.descarga}">${SVG_BAJAR}<span>Descargar</span></a>`;

      p.append(lienzo, info);
      rejilla.appendChild(p);
    });

    v.appendChild(rejilla);
    revelar(v.querySelectorAll(".revelar"));
    scrollTo(0, 0);
  } catch (e) { fallo(e.message); }
}

/* ══════════ Arranque ══════════ */
addEventListener("hashchange", () => {
  if (propio) { propio = false; return; }
  if ($("candado").hidden === false) return;
  const p = decodeURIComponent(location.hash.slice(1));
  p ? verCarpeta(p) : verCarpetas();
});

try {
  const r = await fetch(`${API}/sesion`, { cache: "no-store" });
  const d = await r.json();
  if (d.sesion) {
    $("panel").hidden = false;
    const inicial = decodeURIComponent(location.hash.slice(1));
    inicial ? verCarpeta(inicial) : verCarpetas();
  } else {
    mostrarCandado(d.bloqueadoMs || 0);
  }
} catch {
  mostrarCandado();
}
</script>
</body>
</html>
